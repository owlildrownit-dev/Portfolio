openapi: 3.0.3
info:
  title: Station API
  version: 1.0.0
  description: Demonstration API specification for a technical writing portfolio.
servers:
  - url: https://api.example.com/api/v1
paths:
  /bookings:
    post:
      summary: Create a booking
      operationId: createBooking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateBookingRequest:
      type: object
      required: [tripId, seatId, passenger]
      properties:
        tripId:
          type: integer
          example: 152
        seatId:
          type: integer
          example: 38
        passenger:
          $ref: '#/components/schemas/Passenger'
    Passenger:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          example: Ivan
        lastName:
          type: string
          example: Petrov
    Booking:
      type: object
      required: [id, status, tripId, seatId]
      properties:
        id:
          type: integer
          example: 8432
        status:
          type: string
          enum: [confirmed, cancelled]
          example: confirmed
        tripId:
          type: integer
          example: 152
        seatId:
          type: integer
          example: 38
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Seat unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
